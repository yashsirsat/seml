{% extends "base.html" %}

{% block content %}
<div class="page-heading">
  <p class="eyebrow eyebrow-red">PASSENGER SERVICES / 01</p>
  <h1>Live bus tracking</h1>
  <p>Select a service to check its latest shared location.</p>
</div>
<form id="trackForm" class="workflow-form">
  <div class="form-field">
    <label for="bus_service">Bus service</label>
    <select id="bus_service" name="bus_service" required>
      <option value="">Select a route and departure</option>
      {% for bus in bus_services %}
      <option value="{{ bus['bus_name'] }}|{{ bus['bus_type'] }}|{{ bus['bus_start_time'] }}" {% if selected_service == bus['bus_name'] ~ '|' ~ bus['bus_type'] ~ '|' ~ bus['bus_start_time'] %}selected{% endif %}>{{ bus['bus_name'] }} · {{ bus['start_point'] }} to {{ bus['end_point'] }} · {{ bus['bus_type'] }} · {{ bus['bus_start_time'] }}</option>
      {% endfor %}
    </select>
  </div>
  <button type="submit">Find bus <span aria-hidden="true">&#8594;</span></button>
</form>

<section class="tracking-result" aria-live="polite">
  <div class="tracking-pin" aria-hidden="true"></div>
  <div><p class="eyebrow eyebrow-red">LATEST REPORT <span id="trackingBadge" class="tracking-badge">NOT TRACKING</span></p><p class="tracking-status" id="locationDisplay">Select a bus and find its location.</p><p class="update-time">Last updated <span id="timeDisplay">Not available</span></p></div>
</section>

<div id="mapContainer" class="map-panel" style="display:none;">
  <h2>Bus location</h2>
  <iframe id="googleMap" class="map-frame" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Bus location map"></iframe>
</div>

<script>
  const trackForm = document.getElementById('trackForm');
  const locationDisplay = document.getElementById('locationDisplay');
  const timeDisplay = document.getElementById('timeDisplay');
  const trackingBadge = document.getElementById('trackingBadge');
  const mapContainer = document.getElementById('mapContainer');
  const mapFrame = document.getElementById('googleMap');
  let intervalId = null;
  let requestInProgress = false;

  async function fetchLocation() {
    const service = document.getElementById('bus_service').value;

    if (!service) {
      locationDisplay.textContent = 'Please select a service, type, and departure.';
      timeDisplay.textContent = 'Not available';
      trackingBadge.textContent = 'NOT TRACKING';
      trackingBadge.classList.remove('is-live');
      mapContainer.style.display = 'none';
      return;
    }

    if (requestInProgress) return;
    requestInProgress = true;
    const params = new URLSearchParams({
      bus_name: service.split('|')[0],
      bus_type: service.split('|')[1],
      bus_start_time: service.split('|')[2]
    });
    try {
      const response = await fetch(`/bus_location_api?${params}`);
      const data = await response.json();
      if (!response.ok) throw new Error(data.message || 'Could not load bus location.');

      locationDisplay.textContent = data.location;
      timeDisplay.textContent = data.timestamp || 'Not available';
      trackingBadge.textContent = data.active ? 'LIVE UPDATES' : (data.available ? 'LAST KNOWN' : 'NOT TRACKING');
      trackingBadge.classList.toggle('is-live', Boolean(data.active));
      if (data.available) {
        const latitude = Number(data.latitude);
        const longitude = Number(data.longitude);
        const bounds = [
          longitude - 0.01, latitude - 0.01,
          longitude + 0.01, latitude + 0.01
        ].map(value => value.toFixed(5)).join(',');
        const mapParams = new URLSearchParams({
          bbox: bounds,
          layer: 'mapnik',
          marker: `${latitude},${longitude}`
        });
        mapFrame.src = `https://www.openstreetmap.org/export/embed.html?${mapParams}`;
        mapContainer.style.display = 'block';
      } else {
        mapFrame.removeAttribute('src');
        mapContainer.style.display = 'none';
      }
    } catch (error) {
      locationDisplay.textContent = error.message || 'Unable to load the bus location.';
      trackingBadge.textContent = 'UPDATE ERROR';
      trackingBadge.classList.remove('is-live');
      mapContainer.style.display = 'none';
    } finally {
      requestInProgress = false;
    }
  }

  trackForm.addEventListener('submit', event => {
    event.preventDefault();
    if (intervalId) {
      clearInterval(intervalId);
    }
    fetchLocation();
    intervalId = setInterval(fetchLocation, 30000);
  });
  if (document.getElementById('bus_service').value) {
    trackForm.requestSubmit();
  }
</script>
{% endblock %}
